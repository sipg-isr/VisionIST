#   registry: dockerhub
#
# Each service pulls a prebuilt image. Every box listens on 8061 inside
# its container (AI4EU spec); the host port below is the box's own,
# issued once in arrival order and recorded in the registry's
# ports.json - so it is the same in every fleet, and a partial fleet
# has gaps rather than renumbered boxes. On the fleet network a box is
# reachable by its service name on 8061, which is what fleet.json uses.

name: visionist-fleet

services:
  # ABot-Recon streaming 3D reconstruction - camera poses, adjacent relative poses and point maps from a video or a sequence of frames  (~11 GB)
  abot_recon:
    image: docker.io/sipgisr/visionist-abot-recon:latest
    container_name: visionist-abot_recon
    ports: ["9078:8061"]
    environment:
      - PORT=8061
      - MAX_MESSAGE_MB=1024
      - MAX_WORKERS=2
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CLIP image and text embeddings with their cross-modal similarity
