name: publish webui

# The webui is the only image this repo publishes; boxes live in VisionIST_Library.
# It publishes a single moving tag, sipgisr/visionist-webui:latest - image names
# in this project carry no version. The git tag webui-v<version> records which
# commit produced the current :latest.
on:
  push:
    tags: ["webui-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/Dockerfile
          push: true
          tags: sipgisr/visionist-webui:latest
