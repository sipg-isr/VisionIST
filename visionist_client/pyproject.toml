[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionist-client"
version = "0.1.2"
description = "Thin Python client to call deployed AI 'boxes' (gRPC services) by IP:port"
readme = "README.md"
requires-python = ">=3.10"
# The client lives in the GPL-3.0 boxes repo and vendors GPL-derived proto
# helpers, so the package is GPL-3.0 (repo LICENSE, copied into this dir).
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Manuel Ferreira" },{name="Joao P. Costeira"}]
keywords = [
    "grpc", "grpc-client", "inference-serving", "ai-fleet",
    "pipeline", "zstandard", "codec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.50",
    # The vendored proto gencode is built with protobuf 7.35.1 and enforces
    # runtime >= gencode at import time -- do not lower this.
    "protobuf>=7.35.1",
    "grpcio-reflection>=1.50",
    "numpy>=1.21",
    "zstandard>=0.18",
]

[project.urls]
Homepage = "https://github.com/sipg-isr/VisionIST"
Repository = "https://github.com/sipg-isr/VisionIST"
Issues = "https://github.com/sipg-isr/VisionIST/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# Optional: heavy-payload decoding (tapnext/vggt use torch.save). Without this,
# those fields come back as raw bytes.
torch = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
