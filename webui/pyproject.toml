[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionist-webui"
version = "0.1.0"
description = "Declarative web GUI over a fleet of 'boxes' — a thin web layer wrapping the box-agnostic visionist_client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Manuel Ferreira" }]
keywords = ["webui", "grpc", "inference-serving", "ai-fleet", "boxes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    # the box-agnostic client (install the local one for development)
    "visionist-client>=0.1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6",
    "python-multipart>=0.0.9",
    # zstandard: the zstd_pickle codec needs it in the backend venv too
    "zstandard>=0.18",
]

[project.optional-dependencies]
# heavy-payload decoding; without it those payloads degrade to raw uploads
torch = ["torch>=2.0"]
dev = ["pytest>=7", "httpx>=0.27", "pillow>=10"]   # pillow: test-only (jpeg fixtures) — CI installs [dev]

[project.scripts]
visionist-webui = "webui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
