# Sentence-BERT box — stateless text embeddings.
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/sbert/README.md
id: sbert
name: "Sentence-BERT · text embeddings"
box_key: sbert
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/sbert/README.md

inputs:
  - field: texts
    widget: tags
    kind: ss
    multiple: true
    required: true
    placeholder: "one sentence per tag"

command:
  values: [encode, reset]
  default: encode

results:
  - field: embeddings
    visualizer: tensor
    caption: "sentence embeddings (n × dim)"
  - field: similarities
    visualizer: matrix
    caption: "sentence × sentence similarity"
  - field: "*"
    visualizer: json
