# MoGe-3 box — monocular 3D geometry (depth / points / normals / intrinsics).
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/moge/README.md
id: moge
name: "MoGe · monocular 3D geometry"
box_key: moge
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/moge/README.md
note: >
  One output dict per input image (OpenCV camera coordinates, z forward):
  metric point map, metric depth, surface normals, normalized intrinsics.
  Heavy GPU box — the first call after idle includes the CPU→GPU model move.
  CPU inference is rejected by the box (CUDA-only refinement kernels).

inputs:
  - field: images
    widget: image_upload
    kind: bb
    multiple: true
    required: true
    helper: video_frames

command:
  values: [infer, reset]
  default: infer

parameters:
  - key: fov_x
    widget: number
    min: 0
    max: 180
    placeholder: "omit = auto — known camera horizontal FOV in degrees (improves metric accuracy)"
  - key: refine_steps
    widget: slider
    min: 0
    max: 10
    step: 1
    default: 3
    placeholder: "MoGe-3 sparse refinement steps (0 = off, fastest)"
  - key: resolution_level
    widget: slider
    min: 0
    max: 9
    step: 1
    default: 9
    placeholder: "inference resolution (0 = fast, 9 = highest quality)"

# fp16 is deliberately not in the form: the box defaults to true, and a
# select could only send strings (the wire passes parameters through raw,
# so "false" would read as truthy on the box side).

results:
  - field: results
    visualizer: field_map
    caption: "metric depth (m) per image"
    params:
      prop: depth
  - field: results
    visualizer: field_map
    caption: "surface normals per image (X=red, Y=green, Z=blue, camera coords)"
    params:
      prop: normal
  - field: results
    visualizer: points
    caption: "metric point cloud per image (orbit/zoom) — every pixel back-projected from the depth map, colored by the input image"
    base: images
    params:
      depth: depth
      intrinsics: intrinsics
      mask: mask
  - field: results
    visualizer: matrix
    caption: "normalized camera intrinsics per image"
    params:
      prop: intrinsics
  - field: results
    visualizer: json
    caption: "decoded per-image dicts"
  - field: "*"
    visualizer: json
