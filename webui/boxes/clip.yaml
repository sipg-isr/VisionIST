# CLIP box — stateless embeddings.
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/clip/README.md
id: clip
name: "CLIP · image & text embeddings"
box_key: clip
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/clip/README.md
note: "At least one of images or texts per call; cross-modal similarity comes out as the similarity matrix."

inputs:
  - field: images
    widget: image_upload
    kind: bb
    multiple: true
    required: false
  - field: texts
    widget: tags
    kind: ss
    multiple: true
    required: false

command:
  values: [encode, reset]
  default: encode

parameters:
  - key: model
    widget: select
    values: ["ViT-B/32"]
    default: "ViT-B/32"
    placeholder: "checkpoint loaded at startup — listed for API consistency"

results:
  - field: image_emb
    visualizer: tensor
    caption: "image embeddings (n_img × 512)"
  - field: text_emb
    visualizer: tensor
    caption: "text embeddings (n_txt × 512)"
  - field: similarity
    visualizer: matrix
    caption: "cross-modal similarity logits (n_img × n_txt)"
    params:
      row_labels: images   # form field providing the row labels (image 1..n)
      col_labels: texts    # form field providing the col labels (the prompts)
  - field: "*"
    visualizer: json
