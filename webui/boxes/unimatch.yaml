# UniMatch — dense geometric estimation (unified optical flow / stereo / depth).
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/unimatch/README.md
id: unimatch
name: "UniMatch · optical flow & stereo disparity"
box_key: unimatch
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/unimatch/README.md
note: >
  Two-image dense estimation from one unified backbone.  Pick the command,
  then the matching checkpoint under `model`:
  flow needs the gmflow checkpoint and two consecutive frames of a scene;
  stereo needs the gmstereo checkpoint and a rectified left/right pair.
  Inputs larger than ~1.6 MP are auto-downscaled by the box (response
  config says auto_resized: true) unless you pass inference_size.
  Results are tensors — each panel shows dtype/shape/size, value stats
  and distribution, the spatial preview, and a one-click .npy download.
input_mosaic: false   # the result panels already show the inputs (quiver base / heat)

inputs:
  - field: images
    widget: image_upload
    kind: bb
    multiple: true
    required: true
    helper: upload exactly two images — first/left, then second/right
    constraint: >
      flow: two consecutive frames of the same camera;
      stereo: a calibrated, rectified stereo pair (left, then right)

command:
  values: [flow, stereo, reset]
  default: flow

parameters:
  - key: model
    widget: select
    values:
      - "gmflow-scale1-mixdata-train320x576-4c3a6e9a.pth"   # flow (baked into the image)
      - "gmstereo-scale1-sceneflow-124a438f.pth"            # stereo
      - "gmdepth-scale1-scannet-d3d1efb5.pth"               # depth (not in the form's commands)
    default: "gmflow-scale1-mixdata-train320x576-4c3a6e9a.pth"
    placeholder: >
      gmflow = optical flow, gmstereo = stereo disparity, gmdepth = depth —
      picked per command; downloaded on first use

  - key: inference_size
    widget: json
    placeholder: "[height, width] — e.g. [480, 854]; empty = auto size (capped at ~1.6 MP)"

  - key: padding_factor
    widget: number
    default: 16

# Tensor outputs — rendered by the `tensor` visualizer (dtype/shape/size +
# value stats + distribution histogram + .npy download), with the
# box-declared spatial preview (params.spatial):
#   flow  -> quiver of the dense (u,v per pixel) field over the first input image
#   heat  -> viridis heat image of the (H, W) field
results:
  - field: flow
    visualizer: tensor
    caption: "optical flow — first image → second (u, v per pixel)"
    base: images            # first uploaded image = the quiver background
    params: {spatial: flow}
  - field: occ_fwd
    visualizer: tensor
    caption: "forward-occlusion mask (1 = occluded; needs pred_bidir_flow)"
    params: {spatial: heat}
  - field: occ_bwd
    visualizer: tensor
    caption: "backward-occlusion mask (1 = occluded; needs pred_bidir_flow)"
    params: {spatial: heat}
  - field: disparity
    visualizer: tensor
    caption: "stereo disparity (px)"
    params: {spatial: heat}
  - field: depth
    visualizer: tensor
    caption: "depth map (depth command only)"
    params: {spatial: heat}
  - field: "*"
    visualizer: json
