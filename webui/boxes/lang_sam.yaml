# LangSAM box — language-guided segmentation.
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/lang_sam/README.md
id: lang_sam
name: "LangSAM · text segmentation"
box_key: lang_sam
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/lang_sam/README.md
note: >
  One output dict per input image (masks, bboxes, scores, …).  The legacy
  flat config shape is still accepted by the box; the namespaced one here is
  the contract.

inputs:
  - field: images
    widget: image_upload
    kind: bb
    multiple: true
    required: true

command:
  values: [segment, reset]
  default: segment

parameters:
  - key: box_threshold
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.01
    default: 0.3
  - key: text_threshold
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.01
    default: 0.25
  - key: device
    widget: select
    values: [auto, cpu, cuda, "cuda:0"]
    default: auto

section:
  - key: text_prompt
    widget: tags
    required: true
    placeholder: "e.g. a dog · the wood pile"

results:
  - field: results
    visualizer: overlay
    base: images
    layers:
      - prop: boxes     # live box keys: boxes / masks / scores / text_labels / mask_scores
        layer: box
      - prop: masks
        layer: mask
        opacity: 0.7
    note: >
      per-image item dict (verified against the running box).
      Masks are colored per region (box i pairs with mask i); the
      legend under the canvas lists the label and score of each
      colored region (text_labels / scores keys).
  - field: results
    visualizer: table
    caption: "decoded per-item dictionaries"
  - field: "*"
    visualizer: json
