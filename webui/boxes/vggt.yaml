# VGGT box — 3D reconstruction from image sequences.
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/vggt/README.md
id: vggt
name: "VGGT · 3D reconstruction"
box_key: vggt
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/vggt/README.md
note: >
  All frames must share height/width and be RGB. The box declares its
  payload encoding: torch tensors (decoded with full shape) plus the raw
  .glb scene (identity). Heavy call — first request after idle includes the
  CPU→GPU model move.

inputs:
  - field: images
    widget: image_upload
    kind: bb
    multiple: true
    required: true
    constraint: "identical height/width, RGB frames"
    helper: video_frames

command:
  values: [reconstruct, reset]
  default: reconstruct

parameters:
  - key: conf_threshold
    widget: slider
    min: 0
    max: 100
    step: 1
    default: 30
    placeholder: "GLB mesh confidence threshold — higher ⇒ sparser mesh"
  - key: device
    widget: select
    values: ["cpu", "cuda"]
    placeholder: "auto — the box uses the GPU when visible (only send when overriding)"

results:
  - field: glb_file
    visualizer: glb
    caption: "reconstructed scene (glTF binary)"
  - field: world_points
    visualizer: tensor
    caption: "world-space points (N × 3)"
  - field: world_points_conf
    visualizer: tensor
    caption: "per-point confidence (N)"
  - field: depth
    visualizer: tensor
    caption: "depth maps (frames × H × W)"
  - field: depth_conf
    visualizer: tensor
    caption: "depth confidence (frames × H × W)"
  - field: extrinsic
    visualizer: tensor
    caption: "camera extrinsics (frames × 4 × 4)"
  - field: intrinsic
    visualizer: tensor
    caption: "camera intrinsics (frames × 3 × 3)"
  - field: images
    visualizer: json
    caption: "normalized CHW frames as fed to VGGT"
  - field: "*"
    visualizer: json
