# YOLO box — object detection AND tracking on images and videos.
# Authoritative request shape: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/yolo/README.md
id: yolo
name: "YOLO · detection + tracking (images & video)"
box_key: yolo
input_mosaic: false   # redundant: the annotated result IS the input (with boxes)
docs: https://github.com/sipg-isr/VisionIST_Library/blob/main/boxes/yolo/README.md
note: >
  Tracking is always on: every detection carries a stable track id for
  THIS console's session (the table has a track_id column, the annotated
  frames are labelled with ids). One call tracks over every frame you
  send. Send image files (or a video — frames are extracted in your
  browser) for client-side frame delivery, or upload a raw video file and
  the box decodes it server-side. Image input → the panel leads with the
  annotated **grid** + detections table; video input → the annotated
  **video** is the view (the per-frame JPEG grid then stays in the
  artifacts list / raw JSON).

inputs:
  - field: images
    widget: video_frames
    kind: bb
    multiple: true
    required: false
    helper: >
      image files, or a video (mp4/webm/mov) whose frames are extracted in
      your browser and sent as images.
  - field: video
    widget: file_upload
    kind: b
    multiple: false
    required: false
    helper: >
      raw video file (mp4/avi/webm/mov) — the box decodes it server-side
      (see frame_step / max_frames). Send either this or images, not both.

command:
  # tracking is always on (ids follow the session), so "detect" carries the
  # track ids too; "list" is the session-action view (see session.actions)
  values: [detect, reset, list]
  default: detect

parameters:
  - key: weights
    widget: select
    values: ["yolov8n.pt", "yolov8s.pt", "yolov8m.pt", "yolov11n.pt", "yolov11s.pt"]
    default: "yolov8n.pt"
    placeholder: "fresh checkpoints download on first use (see box README for paths/URLs)"
  - key: conf
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.05
    default: 0.25
  - key: iou
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.05
    default: 0.7
  - key: imgsz
    widget: select
    values: ["320", "416", "640", "960"]
    default: "640"
  - key: classes
    widget: tags
    placeholder: "class ids to keep (e.g. 16 = dog); empty = all classes"
  - key: save_annotated
    widget: select
    values: ["true", "false"]
    default: "false"
    placeholder: "false = detections JSON only (fast even for long videos); true = also encodes annotated JPEGs + mp4 (H.264, ~0.4 s/24 frames)"
  - key: frame_step
    widget: number
    default: 1
    placeholder: "video: sample every Nth frame"
  - key: max_frames
    widget: number
    default: 128
    placeholder: "video: safety cap on decoded frames"

session:
  key: session_id
  auto_generate: true
  actions: [reset, list]
  note: >
    Per-session tracker state (tapnext contract): track ids stay stable
    across calls in this session only, and every fresh tracker starts at
    id 1 — so a new session (regenerate, page load) behaves like a reset.
    "reset" clears this session's tracker; "list" shows the box's active
    sessions.

results:
  # Video input: one annotated mp4 (source fps, H.264) is the view.
  - field: annotated_video
    visualizer: video
    caption: "annotated video (video input only; source fps, H.264)"
  # Image input: the per-frame annotated JPEGs are the view.  ``only_if_missing``
  # keeps them out of the video case (the mp4 is the view there; the JPEGs
  # still surface via the artifacts list / raw JSON).
  - field: annotated
    visualizer: image_grid
    caption: "annotated frames (one JPEG per input frame)"
    only_if_missing: annotated_video
  # Download all annotated artifacts as a single ZIP (works for both inputs).
  - field: annotated_zip
    visualizer: download
    caption: "download: annotated frames + detections + manifest (ZIP)"
    params:
      filename: "yolo-annotations.zip"
  - field: detections
    visualizer: table
    caption: "per-frame detections (boxes xyxy, class id, label, score, track id)"
    params:
      filename: "yolo-detections.json"
  - field: "*"
    visualizer: json
